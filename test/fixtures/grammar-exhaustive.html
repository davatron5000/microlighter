<!doctype html>
<html lang="en" data-syntax-theme="github">
<head>
  <meta charset="utf-8">
  <title>MicroLighter grammar exhaustive fixture</title>
  <!--
    Not published to docs/: this fixture exists only to verify, in a real
    browser, that every language in docs/languages.js loads its grammar and
    highlights via the built docs/microlighter runner. Samples come from
    docs/samples/, the same files the homepage playground uses. It is
    intentionally unstyled and is not part of the curated homepage demo.
  -->
  <link rel="stylesheet" href="../../docs/microlighter/themes/index.css">
  <style>
    pre {
      margin-block-end: 1rem;
      padding: 0.75rem;
      background: var(--syntax-background, #151515);
      color: var(--syntax-foreground, #ececec);
    }
  </style>
</head>
<body>
  <main></main>
  <script type="module">
    import languages from "../../docs/languages.js";
    import { highlightAll } from "../../docs/microlighter/index.js";

    const main = document.querySelector("main");
    const blocks = await Promise.all(languages.map(async ({ name }) => {
      const response = await fetch(`../../docs/samples/${name}.sample`);
      const code = document.createElement("code");
      code.className = `language-${name}`;
      code.textContent = (await response.text()).replace(/\n$/, "");
      const pre = document.createElement("pre");
      pre.append(code);
      return pre;
    }));
    main.append(...blocks);

    await highlightAll();
    // Tests wait for this before reading CSS.highlights.
    document.documentElement.dataset.highlighted = "true";
  </script>
</body>
</html>
